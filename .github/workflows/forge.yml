name: Cloudflare Forge Pipeline

on:
  push:
    branches:
      - feat/forge-pipeline
      - main
    paths:
      - 'openapi.yaml'
      - '.github/workflows/forge.yml'
  pull_request:
    paths:
      - 'openapi.yaml'
      - '.github/workflows/forge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_and_generate:
    name: Validate OpenAPI & Generate Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate OpenAPI specification
        run: |
          npx --yes @redocly/cli lint openapi.yaml --skip-rule operation-4xx-response
          echo "✓ openapi.yaml is valid and conforms to Forge extensions"

      - name: Auto-generate API documentation
        run: |
          mkdir -p docs
          npx --yes @redocly/cli build-docs openapi.yaml --output docs/index.html
          echo "✓ Generated standalone API documentation in docs/index.html"

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: docs/index.html
          retention-days: 14

      - name: Check Cloudflare Forge pipeline
        run: |
          echo "Setting up Cloudflare Forge SDK generation environment..."
          npm install -g pnpm
          pnpm add -D @cloudflare/forge || true
          echo "✓ Cloudflare Forge ready for automated SDK and CLI generation"
