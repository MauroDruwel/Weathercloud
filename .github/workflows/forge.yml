name: Cloudflare Forge Pipeline

on:
  push:
    branches:
      - feat/forge-pipeline
      - main
    paths:
      - 'openapi.yaml'
      - 'fern/**'
      - '.github/workflows/forge.yml'
  pull_request:
    paths:
      - 'openapi.yaml'
      - 'fern/**'
      - '.github/workflows/forge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_and_generate:
    name: Validate OpenAPI, Fern & Generate Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate OpenAPI specification
        run: |
          npx --yes @redocly/cli lint openapi.yaml --skip-rule operation-4xx-response
          echo "✓ openapi.yaml is valid and conforms to Forge extensions"

      - name: Validate Fern definition
        run: |
          npx --yes fern-api check
          echo "✓ Fern workspace and docs configuration passed verification"

      - name: Generate API Documentation for Cloudflare Pages
        run: |
          npx --yes @redocly/cli build-docs openapi.yaml -o docs/index.html \
            --title "Weathercloud API Reference" \
            --theme.openapi.colors.primary.main="#f6821f" \
            --theme.openapi.sidebar.backgroundColor="#0f172a" \
            --theme.openapi.sidebar.textColor="#f8fafc" \
            --theme.openapi.rightPanel.backgroundColor="#0b0f19"
          echo "✓ Generated documentation in docs/index.html using official CLI"

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: docs/index.html
          retention-days: 14
