name: Cloudflare Forge Pipeline

on:
  push:
    branches:
      - feat/forge-pipeline
      - main
    paths:
      - 'openapi.yaml'
      - 'fern/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/forge.yml'
  pull_request:
    paths:
      - 'openapi.yaml'
      - 'fern/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/forge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge_pipeline:
    name: Cloudflare Forge Validation, Generation & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Validate OpenAPI specification
        run: |
          npx --yes @redocly/cli lint openapi.yaml --skip-rule operation-4xx-response
          echo "✓ openapi.yaml is valid and conforms to Forge extensions"

      - name: Validate Fern definition
        run: |
          npx --yes fern-api check
          echo "✓ Fern workspace and docs configuration passed verification"

      - name: Generate typed SDKs via Fern
        run: |
          npx --yes fern-api generate --group python-sdk --local --force
          python -c "import weathercloud; print('✓ Verified weathercloud v' + weathercloud.__version__)"
          echo "✓ Generated Python SDK in src/weathercloud"

      - name: Run test suite across sync and async SDK clients
        run: |
          pytest -v

      - name: Generate Scalar API Documentation for Cloudflare Pages
        run: |
          python scripts/forge.py docs
          echo "✓ Generated standalone Scalar API Reference in docs/index.html"

      - name: Build distribution packages
        run: |
          uv build
          echo "✓ Built wheel and sdist distributions in dist/"

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: docs/index.html
          retention-days: 14

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          retention-days: 14
