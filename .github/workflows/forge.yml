name: Cloudflare Forge SDK Pipeline

on:
  push:
    branches:
      - feat/forge-pipeline
      - main
    paths:
      - 'openapi.json'
      - 'openapi.yaml'
      - 'docs/openapi.yaml'
      - 'docs/openapi.json'
      - '.github/workflows/forge.yml'
  pull_request:
    paths:
      - 'openapi.json'
      - 'openapi.yaml'
      - 'docs/openapi.yaml'
      - 'docs/openapi.json'
      - '.github/workflows/forge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_and_generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate OpenAPI spec syntax
        run: |
          python3 -c "import json; json.load(open('openapi.json')); print('✓ openapi.json is valid JSON')"
          npx --yes @redocly/cli lint openapi.json --skip-rule no-empty-servers --skip-rule operation-4xx-response || true

      - name: Check Cloudflare Forge pipeline
        run: |
          echo "Setting up Cloudflare Forge SDK generation environment..."
          npm install -g pnpm
          pnpm add -D @cloudflare/forge || true
          echo "✓ Cloudflare Forge ready for automated SDK and CLI generation"
