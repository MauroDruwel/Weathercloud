name: Cloudflare Forge Pipeline

on:
  push:
    branches:
      - feat/forge-pipeline
      - main
    paths:
      - 'openapi.yaml'
      - 'fern/**'
      - 'scripts/generate_docs.py'
      - '.github/workflows/forge.yml'
  pull_request:
    paths:
      - 'openapi.yaml'
      - 'fern/**'
      - 'scripts/generate_docs.py'
      - '.github/workflows/forge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_and_generate:
    name: Validate OpenAPI, Fern & Generate Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate OpenAPI specification
        run: |
          npx --yes @redocly/cli lint openapi.yaml --skip-rule operation-4xx-response
          echo "✓ openapi.yaml is valid and conforms to Forge extensions"

      - name: Validate Fern definition
        run: |
          npx --yes fern-api check
          echo "✓ Fern workspace and docs configuration passed verification"

      - name: Generate Fern / Cloudflare Docs UI
        run: |
          python3 scripts/generate_docs.py
          echo "✓ Generated standalone Fern / Cloudflare Docs UI in docs/index.html"

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: docs/index.html
          retention-days: 14
