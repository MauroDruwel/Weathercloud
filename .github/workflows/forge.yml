name: Cloudflare Forge Pipeline

on:
  push:
    branches:
      - feat/forge-pipeline
      - main
    paths:
      - 'openapi.yaml'
      - 'fern/**'
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/forge.yml'
  pull_request:
    paths:
      - 'openapi.yaml'
      - 'fern/**'
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/forge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge_pipeline:
    name: Cloudflare Forge Validation, Docs & Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate OpenAPI specification
        run: npm run lint:openapi

      - name: Validate Fern definition
        run: npm run lint:fern

      - name: Bundle OpenAPI for Scalar Documentation
        run: npm run docs

      - name: Verify SDK generation across all languages
        run: npm run generate

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: |
            docs/index.html
            docs/openapi.json
          retention-days: 14
