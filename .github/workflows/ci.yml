name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge-ci:
    uses: MauroDruwel/quality-gate/.github/workflows/forge-ci.yml@main
    with:
      spec-path: "docs/openapi.yaml"
      validate-spec: true
      check-drift: true
      run-python-checks: true
      run-rust-checks: false
      run-typescript-checks: false
