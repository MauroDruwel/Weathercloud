openapi: 3.0.3
info:
  title: Weathercloud Unofficial API
  description: |
    Reverse-engineered API for [app.weathercloud.net](https://app.weathercloud.net).

    **No authentication required** — all endpoints work without any CSRF token or login.

    ---

    ### IDs

    | Type | Format | Example |
    |------|--------|---------|
    | Weather station | 10-digit numeric string | `5726468552` from `app.weathercloud.net/d5726468552` |
    | METAR / airport | ICAO code (4 letters) | `EBBR` for Brussels Airport |

    ### METAR support
    Most `device/*` routes also work for METAR (airport) stations by swapping the prefix:
    `/device/values/{id}` → `/metar/values/{id}`

    ### Rate limiting
    Weathercloud rate-limits API requests. Free stations update every **10 minutes**, paid stations every **1 minute** — avoid polling more frequently than that.

    ---

    ### Import into Postman / API tools
    **File → Import** → upload `openapi.yaml` (or paste the raw URL of this file).

    > **Home Assistant** — most useful endpoints:
    > - `GET /device/values/{deviceId}` — live sensor readings
    > - `GET /device/stats` — current + daily/monthly/yearly min/max
    > - `GET /device/info/{deviceId}` — station metadata

    ---

    ### Python Client Library
    This API is natively wrapped by the [`weathercloud`](https://pypi.org/project/weathercloud/) Python package:
    ```bash
    pip install weathercloud
    ```
    ```python
    from weathercloud import WeathercloudClient

    with WeathercloudClient() as client:
        conditions = client.get_current_conditions("5726468552")
        print(f"Temperature: {conditions.temperature}°C, Humidity: {conditions.humidity}%")
    ```

    ---

    ### Cloudflare Forge Surface Tooling (CLI & MCP)
    This specification powers the **Cloudflare Forge** surface tooling architecture:
    - **CLI Generation**: OpenAPI operations are automatically transformed into native command-line interfaces.
    - **Model Context Protocol (MCP)**: Operations map into standardized MCP tool definitions for AI agents (Claude, Cursor, Antigravity) to query live station readings directly.
    - **Typed SDK Generation**: Multi-language SDK generation powered by Fern.
  version: "1.0.0"
  contact:
    name: Mauro Druwel
    url: https://github.com/MauroDruwel/Weathercloud
  license:
    name: MIT
    url: https://github.com/MauroDruwel/Weathercloud/blob/main/LICENSE

servers:
  - url: https://app.weathercloud.net
    description: Production Weathercloud API

security: []

tags:
  - name: Device (live)
    description: Real-time and current sensor data — most useful for Home Assistant
  - name: Device (history)
    description: Historical data and time-series
  - name: Forecast
    description: Weather forecast
  - name: Map
    description: Map / nearby station discovery
  - name: Pages
    description: Station listing pages
  - name: Miscellaneous
    description: Undocumented tricks and HTML scraping
  - name: Authentication
    description: User session and login endpoints

paths:

  /signin:
    post:
      operationId: login
      x-fern-sdk-group-name: auth
      x-fern-sdk-method-name: login
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            # Login is optional; required only for private indoor sensors
            client = WeathercloudClient(username="my_user", password="my_password")
            client.login()
      tags: [Authentication]
      summary: User login / authentication
      description: |
        Authenticates a user session to allow viewing private indoor sensors (`tempin`, `humin`, `heatin`) for the user's station.
        This endpoint expects form urlencoded data and returns a `302 Found` redirect on successful login.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                "LoginForm[entity]":
                  type: string
                  description: Username or email address
                "LoginForm[password]":
                  type: string
                  description: Account password
                "LoginForm[rememberMe]":
                  type: string
                  enum: ["0", "1"]
                  default: "1"
                  description: Keep the user logged in
              required:
                - "LoginForm[entity]"
                - "LoginForm[password]"
      responses:
        "302":
          description: Successful authentication redirecting to user profile
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Session cookies (e.g. `PHPSESSID`)
        "200":
          description: Authentication failed (renders login form with errors)

  /device/values/{deviceId}:
    get:
      operationId: getDeviceValues
      x-fern-sdk-group-name: device.live
      x-fern-sdk-method-name: getValues
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                conditions = client.get_current_conditions("5726468552")
                print(f"Temperature: {conditions.temperature}°C, Humidity: {conditions.humidity}%")
      tags: [Device (live)]
      summary: Current sensor readings ⭐
      description: |
        Returns the latest sensor values for a device. **No CSRF token needed.**
        This is the primary endpoint for a Home Assistant sensor integration.
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Current weather readings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceValues'
              example:
                epoch: 1779825116
                temp: 24.8
                dew: 15.2
                chill: 24.8
                heat: 24.8
                hum: 55
                bar: 1024.9
                wdir: 344
                wspd: 0.6
                wspdavg: 0.6
                wspdhi: 1.0
                rainrate: 0
                rain: 0
                solarrad: 0.0
                uvi: 0
                wdiravg: 344

  /device/stats:
    get:
      operationId: getDeviceStats
      x-fern-sdk-group-name: device.live
      x-fern-sdk-method-name: getStats
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                stats = client.get_device_stats("5726468552")
                print("Max temp today:", stats.get("temp_day_max"))
                print("Total rain this month:", stats.get("rain_month_total"))
      tags: [Device (live)]
      summary: Current + min/max statistics ⭐
      description: |
        Returns current values plus day/month/year min and max for all sensors.
        Each value is a `[unix_timestamp, value]` tuple.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          example: "5726468552"
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Statistics for all sensors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStats'

  /device/info/{deviceId}:
    get:
      operationId: getDeviceInfo
      x-fern-sdk-group-name: device.live
      x-fern-sdk-method-name: getInfo
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                info = client.get_station_info("5726468552")
                print(f"Name: {info.name}")
                print(f"City: {info.city}")
                print(f"Coordinates: ({info.latitude}, {info.longitude})")
                print(f"Status: {info.status}")
      tags: [Device (live)]
      summary: Station metadata ⭐
      description: Station name, location, elevation, equipment info.
      parameters:
        - $ref: '#/components/parameters/deviceIdPath'
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Station metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'

  /device/wind:
    get:
      operationId: getWindRose
      x-fern-sdk-group-name: device.live
      x-fern-sdk-method-name: getWindRose
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                wind = client.get_wind_rose("5726468552")
                print("Wind rose distribution:", wind)
      tags: [Device (live)]
      summary: Wind rose data
      description: Wind direction distribution data for the wind rose chart.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          example: "5726468552"
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Wind rose data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WindData'

  /device/ajaxupdatedate:
    post:
      operationId: getUpdateStatus
      x-fern-sdk-group-name: device.live
      x-fern-sdk-method-name: getUpdateStatus
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                status = client.get_update_status("5726468552")
                print(f"Seconds since update: {status.get('update')}")
      tags: [Device (live)]
      summary: Last update time + status
      description: |
        Returns seconds since last update and device online status.

        > ⚠️ **Requires `X-Requested-With: XMLHttpRequest`** header — without it the server returns an empty 200.
      parameters:
        - $ref: '#/components/parameters/xRequestedWith'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [d]
              properties:
                d:
                  type: string
                  description: Device ID
                  example: "5726468552"
      responses:
        "200":
          description: Update date info
          content:
            application/json:
              schema:
                type: object
                properties:
                  update:
                    type: integer
                    description: Seconds since last update
                    example: 71
                  status:
                    type: string
                    description: '"1" = online, "2" = recently online, "3" = offline'
                    example: "2"
                  server_time:
                    type: integer
                    description: Current server Unix timestamp
                    example: 1779825187

  /device/ajaxprofile:
    post:
      operationId: getOwnerProfile
      x-fern-sdk-group-name: device.live
      x-fern-sdk-method-name: getOwnerProfile
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                profile = client.get_owner_profile("5726468552")
                print(f"Observer: {profile.get('name')}")
                print(f"Model: {profile.get('model')}")
      tags: [Device (live)]
      summary: Station owner profile
      description: |
        Returns observer name, follower count, and device brand/model.

        > ⚠️ **Requires `X-Requested-With: XMLHttpRequest`** header — without it the server returns an empty 200.
      parameters:
        - $ref: '#/components/parameters/xRequestedWith'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [d]
              properties:
                d:
                  type: string
                  example: "5726468552"
      responses:
        "200":
          description: Profile info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceProfile'
              example:
                observer:
                  name: "Gino Wallaert"
                  nickname: "Ginometeo"
                  company: ""
                followers:
                  number: "1"
                device:
                  brand: "Other"
                  model: "Other"

  /device/evolution:
    post:
      operationId: getEvolution
      x-fern-sdk-group-name: device.history
      x-fern-sdk-method-name: getEvolution
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import VariableCode, WeathercloudClient

            with WeathercloudClient() as client:
                history = client.get_evolution(
                    "5726468552",
                    variable=VariableCode.TEMPERATURE,
                    period="week",
                )
                print("Evolution data:", history)
      tags: [Device (history)]
      summary: Time-series history for a variable
      description: |
        Returns hourly aggregated history for a given variable and period.

        > ⚠️ **Requires `X-Requested-With: XMLHttpRequest`** header — without it the server returns an empty 200.
        
        **Variable codes:**
        | Code | Sensor |
        |------|--------|
        | 101  | Temperature (°C) |
        | 201  | Humidity (%) |
        | 541  | Dew point (°C) |
        | 641  | Barometric pressure (hPa) |
        | 701  | Wind speed (m/s) |
        | 6001 | Wind direction (°) |
        | 6501 | Wind gust / high speed (m/s) |
        | 801  | Rain (mm) |
        | 811  | Rain rate (mm/h) |
        | 1001 | Solar radiation (W/m²) |
        | 1101 | UV index |
        
        **Period values:** `day`, `week`, `month`, `year`
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [device, variable, period]
              properties:
                device:
                  type: string
                  example: "5726468552"
                variable:
                  type: integer
                  enum: [101, 201, 541, 641, 701, 6001, 6501, 801, 811, 1001, 1101]
                  example: 101
                period:
                  type: string
                  enum: [day, week, month, year]
                  example: day
      parameters:
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Time-series evolution data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvolutionResponse'

  /forecast/daily:
    get:
      operationId: getForecast
      x-fern-sdk-group-name: forecast
      x-fern-sdk-method-name: getDaily
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                forecast = client.get_forecast("5726468552")
                print("6-day forecast:", forecast)
      tags: [Forecast]
      summary: Daily weather forecast
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          example: "5726468552"
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Daily forecast (6 days from WMO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
              example:
                info:
                  source: WMO
                  web: https://worldweather.wmo.int
                  days: 6
                location:
                  name: Ingelmunster
                forecast:
                  "2026-05-28":
                    weather:
                      code: 12
                    temperature:
                      max: 29
                      min: 16

  /map/devices:
    post:
      operationId: getMapDevices
      x-fern-sdk-group-name: map
      x-fern-sdk-method-name: getDevices
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                devices = client._get_dict("/map/devices")
                print(f"Loaded {len(devices)} active map stations")
      tags: [Map]
      summary: Stations on map within area
      description: |
        Returns stations visible on the map for a given location bounding box.

        > ⚠️ **Requires `X-Requested-With: XMLHttpRequest`** header — without it the server returns an empty 200.
      parameters:
        - $ref: '#/components/parameters/xRequestedWith'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: string
                  description: Filter by user (empty = all)
                location:
                  type: string
                  description: "lat,lon,zoom format"
                  example: "50.9,3.1,10"
      responses:
        "200":
          description: Stations on the map as arrays of scaled values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapDevicesResponse'

  /map/bgdevices:
    post:
      operationId: getMapBgDevices
      x-fern-sdk-group-name: map
      x-fern-sdk-method-name: getBackgroundDevices
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                bg_devices = client._get_dict("/map/bgdevices")
                print(f"Loaded {len(bg_devices)} background stations")
      tags: [Map]
      summary: Background/inactive stations on map
      parameters:
        - $ref: '#/components/parameters/xRequestedWith'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: string
      responses:
        "200":
          description: Inactive/background stations (same array format as /map/devices)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapDevicesResponse'

  /map/metars:
    post:
      operationId: getMapMetars
      x-fern-sdk-group-name: map
      x-fern-sdk-method-name: getMetars
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                metars = client._get_dict("/map/metars")
                print(f"Loaded {len(metars)} METAR airport stations")
      tags: [Map]
      summary: METAR airport observations on map
      parameters:
        - $ref: '#/components/parameters/xRequestedWith'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        "200":
          description: METAR airport observations as arrays
          content:
            application/json:
              schema:
                type: object
                properties:
                  metars:
                    type: array
                    description: |
                      Each entry: `[icao, city, lat, lon, status, 0, wdir, hum, bar*10, wspd*10, wdir2, 0, "", "", ""]`
                    items:
                      type: array
                      example: ["EBBR", "Brussels", 50.9014, 4.4844, 2, 0, 260, 58, 10220, 80, 260, 0, "", "", ""]

  /page/coordinates/latitude/{lat}/longitude/{lon}/distance/{km}:
    get:
      operationId: getNearbyStations
      x-fern-sdk-group-name: stations
      x-fern-sdk-method-name: getNearby
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                nearby = client.get_nearby_stations(lat=50.8503, lon=4.3517, distance_km=10)
                devices = nearby.get("devices", [])
                print(f"Found {len(devices)} nearby stations")
      tags: [Pages]
      summary: Stations near coordinates ⭐
      description: |
        Returns nearby stations as JSON (despite `text/html` content-type header).
        All `page/*` endpoints return `PageDevice` objects that include the **station name**.
        Values are scaled integers — divide by 10 (e.g. `temp: 281` = 28.1°C).
      parameters:
        - name: lat
          in: path
          required: true
          schema:
            type: number
          example: 50.9475
        - name: lon
          in: path
          required: true
          schema:
            type: number
          example: 3.1205
        - name: km
          in: path
          required: true
          schema:
            type: integer
          example: 5
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Nearby stations with name, coordinates and current values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDevicesResponse'

  /page/popular/country/{country}/period/{period}:
    get:
      operationId: getPopularStations
      x-fern-sdk-group-name: stations
      x-fern-sdk-method-name: getPopular
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                popular = client._get_dict("/page/popular/country/all/period/month")
                print("Popular stations:", popular)
      tags: [Pages]
      summary: Popular stations by country
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
          example: BE
        - name: period
          in: path
          required: true
          schema:
            type: string
            enum: [day, week, month]
          example: day
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Popular stations with name and current values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDevicesResponse'

  /page/newest/country/{country}:
    get:
      operationId: getNewestStations
      x-fern-sdk-group-name: stations
      x-fern-sdk-method-name: getNewest
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                newest = client._get_dict("/page/newest/country/all")
                print("Newest stations:", newest)
      tags: [Pages]
      summary: Newest stations by country
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
          example: BE
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Newest stations with name and current values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDevicesResponse'

  /page/followers/country/{country}:
