      operationId: getMostFollowedStations
      x-fern-sdk-group-name: stations
      x-fern-sdk-method-name: getMostFollowed
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                followed = client._get_dict("/page/followers/country/all")
                print("Most followed stations:", followed)
      tags: [Pages]
      summary: Most followed stations by country
      parameters:
        - name: country
          in: path
          required: true
          schema:
            type: string
          example: BE
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Most followed stations with name and current values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDevicesResponse'

  /page/lastviews:
    get:
      operationId: getLastViewedStations
      x-fern-sdk-group-name: stations
      x-fern-sdk-method-name: getLastViews
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                lastviews = client._get_dict("/page/lastviews")
                print("Recently viewed stations:", lastviews)
      tags: [Pages]
      summary: Recently viewed stations
      parameters:
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Last viewed stations (empty array if not logged in)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDevicesResponse'

  /page/own:
    get:
      operationId: getOwnStations
      x-fern-sdk-group-name: stations
      x-fern-sdk-method-name: getOwn
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            # Requires authentication
            client = WeathercloudClient(username="my_user", password="my_password")
            client.login()
            own_stations = client._get_dict("/page/own")
            print("Owned stations:", own_stations)
      tags: [Pages]
      summary: Own stations (requires login)
      parameters:
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Your stations (empty array if not logged in)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDevicesResponse'

  /metar/values/{deviceId}:
    get:
      operationId: getMetarValues
      x-fern-sdk-group-name: metar
      x-fern-sdk-method-name: getValues
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                # Airport ICAO codes automatically use METAR values
                metar = client.get_current_conditions("EBBR")
                print(f"Brussels Airport Temperature: {metar.temperature}°C")
      tags: [Miscellaneous]
      summary: METAR station — current readings
      description: |
        Most `device/*` routes work identically for METAR (airport) stations by replacing the `device` prefix with `metar`.

        METAR station IDs are **ICAO codes** (4 letters), e.g. `EBBR` for Brussels Airport.

        **Supported `metar/*` routes (same request/response as their `device/*` counterparts):**
        - `GET /metar/values/{icao}` — current readings
        - `GET /metar/stats?code={icao}` — statistics
        - `GET /metar/wind?code={icao}` — wind rose
        - `GET /metar/info/{icao}` — station metadata
        - `POST /metar/ajaxupdatedate` — last update time
        - `POST /metar/ajaxprofile` — station profile
        - `POST /metar/evolution` — time-series history

        > **Not supported for METAR:** `/device/ajaxdevicestats`
      parameters:
        - name: deviceId
          in: path
          required: true
          description: ICAO airport code
          schema:
            type: string
          example: "EBBR"
        - $ref: '#/components/parameters/xRequestedWith'
      responses:
        "200":
          description: Same structure as `/device/values/{deviceId}`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceValues'

  /d{deviceId}:
    get:
      operationId: getStationPage
      x-fern-sdk-group-name: stations
      x-fern-sdk-method-name: getStationPage
      x-fern-availability: generally-available
      x-codeSamples:
        - lang: python
          label: Python (weathercloud)
          source: |
            from weathercloud import WeathercloudClient

            with WeathercloudClient() as client:
                name = client.get_station_name("5726468552")
                info = client.get_station_info("5726468552", scrape_name=True, fetch_location=True)
                print(f"{name} located at ({info.latitude}, {info.longitude})")
      tags: [Miscellaneous]
      summary: Station HTML page (scrape station name)
      description: |
        The station **name** is not available from any JSON API endpoint.
        The easiest way to get it is to fetch the station's HTML page and extract
        the name from the `<title>` or `og:title` meta tag.

        **Example response title:**
        ```
        WeatherStation Skyline - Weathercloud | Global network of weather stations
        ```

        Strip everything from ` - Weathercloud` onward to get the clean station name.

        > This is a plain HTML page, not a JSON API. Use it for scraping only.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
          example: "0826505936"
      responses:
        "200":
          description: HTML page — extract station name from `<title>` or `<meta property="og:title">`
          content:
            text/html:
              schema:
                type: string

components:
  parameters:
    deviceIdPath:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
      example: "5726468552"
    xRequestedWith:
      name: X-Requested-With
      in: header
      required: false
      schema:
        type: string
        default: XMLHttpRequest

  schemas:
    DeviceValues:
      type: object
      description: Live sensor readings
      properties:
        epoch:
          type: integer
          description: Unix timestamp of reading
        temp:
          type: number
          description: Temperature (°C)
        dew:
          type: number
          description: Dew point (°C)
        chill:
          type: number
          description: Wind chill (°C)
        heat:
          type: number
          description: Heat index (°C)
        hum:
          type: integer
          description: Relative humidity (%)
        bar:
          type: number
          description: Barometric pressure (hPa)
        wdir:
          type: integer
          description: Instantaneous wind direction (°)
        wdiravg:
          type: integer
          description: Average wind direction (°)
        wspd:
          type: number
          description: Instantaneous wind speed (m/s)
        wspdavg:
          type: number
          description: Average wind speed (m/s)
        wspdhi:
          type: number
          description: Wind gust / high speed (m/s)
        rainrate:
          type: number
          description: Rain rate (mm/h)
        rain:
          type: number
          description: Total rain (mm)
        solarrad:
          type: number
          description: Solar radiation (W/m²)
        uvi:
          type: number
          description: UV index (standard units, not ×10 — can be fractional, e.g. 0.9)
        tempin:
          type: number
          description: Inside temperature (°C) — requires authentication
        humin:
          type: integer
          description: Inside relative humidity (%) — requires authentication
        heatin:
          type: number
          description: Inside heat index (°C) — requires authentication

    DeviceStats:
      type: object
      description: |
        Current readings and period statistics for all sensors.
        All values are `[unix_timestamp, value]` tuples (`TimestampValue`).

        **Key pattern:** `{sensor}_{period}_{type}`
        - Sensors: `temp`, `tempin`, `dew`, `chill`, `heat`, `heatin`, `hum`, `humin`, `bar`, `wdir`, `wdiravg`, `wspd`, `wspdavg`, `wspdhi`, `rainrate`, `rain`, `solarrad`, `uvi`
        - Period types: `current`, `day_max`, `day_min`, `month_max`, `month_min`, `year_max`, `year_min`
        - Rain also has: `day_total`, `month_total`, `year_total`
        - Solarrad also has: `day_hours`, `month_hours`, `year_hours`
      properties:
        last_update:
          type: integer
          description: Unix timestamp of last reading
      additionalProperties:
        $ref: '#/components/schemas/TimestampValue'

    TimestampValue:
      type: array
      description: "[unix_timestamp, value]"
      items:
        type: number
      minItems: 2
      maxItems: 2
      example: [1779825116, 24.8]

    DeviceInfo:
      type: object
      description: |
        Station metadata and current sensor snapshot.
        Note: sensor values are returned as strings; unavailable sensors show `-3276.8` / `-32768`.
      properties:
        device:
          type: object
          properties:
            account:
              type: integer
              description: Account type (0 = free)
            status:
              type: string
              description: '"1" = online, "2" = recently online, "3" = offline'
            city:
              type: string
              description: City name
            altitude:
              type: string
              description: Altitude in metres (as string)
            image:
              type: string
              nullable: true
              description: URL to station photo, or null
            isWebcam:
              type: boolean
            favorite:
              type: boolean
            social:
              type: boolean
            update:
              type: integer
              description: Seconds since last update
        values:
          type: object
          description: |
            Current sensor readings as strings.
            Unavailable sensors return `"-3276.8"` (float sensors) or `"-32768"` (integer sensors).
          properties:
            temp:
              type: string
              description: Temperature (°C)
            hum:
              type: string
              description: Relative humidity (%)
            dew:
              type: string
              description: Dew point (°C)
            wspdavg:
              type: string
              description: Average wind speed (m/s)
            wdiravg:
              type: string
              description: Average wind direction (°)
            bar:
              type: string
              description: Barometric pressure (hPa)
            rain:
              type: string
              description: Total rain (mm)
            rainrate:
              type: string
              description: Rain rate (mm/h)
            solarrad:
              type: string
              description: Solar radiation (W/m²)
            uvi:
              type: string
              description: UV index

    DeviceProfile:
      type: object
      properties:
        observer:
          type: object
          properties:
            name:
              type: string
            nickname:
              type: string
            company:
              type: string
        followers:
          type: object
          properties:
            number:
              type: string
        device:
          type: object
          properties:
            brand:
              type: string
            model:
              type: string

    WindData:
      type: object
      properties:
        date:
          type: integer
          description: Unix timestamp (start of period)
        values:
          type: array
          description: 16 compass directions, each with sum and scale array
          items:
            type: object
            properties:
              sum:
                type: number
              scale:
                type: array
                items:
                  type: integer

    EvolutionResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            timezone:
              type: string
              example: "Europe/Brussels"
            summary:
              type: object
              description: Keyed by variable code (e.g. "101")
              additionalProperties:
                type: object
                properties:
                  samples:
                    type: integer
                  sum:
                    type: number
                  min:
                    type: number
                  min_time:
                    type: integer
                  max:
                    type: number
                  max_time:
                    type: integer
            values:
              type: object
              description: |
                Keyed by Unix timestamp (hour buckets), then by variable code.
                Each entry has `samples` and `stats`.
              additionalProperties:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    samples:
                      type: integer
                    stats:
                      type: object
                      properties:
                        sum:
                          type: number
                        min:
                          type: number
                        min_time:
                          type: integer
                        max:
                          type: number
                        max_time:
                          type: integer

    PageDevice:
      type: object
      description: Station entry returned by page/coordinates
      properties:
        type:
          type: string
          example: device
        code:
          type: string
          description: Device ID (numeric string)
          example: "2034767194"
        name:
          type: string
          description: Station name as set by the owner
          example: "WeatherStation Skyline"
        city:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        elevation:
          type: string
          description: Altitude in metres
        image:
          type: string
        isWebcam:
          type: boolean
        account:
          type: integer
        isFavorite:
          type: boolean
        update:
          type: integer
          description: Seconds since last update
        data:
          type: string
          description: Distance from query point (km)
        values:
          type: object
          description: |
            Scaled integer sensor readings — divide by 10 for most values.
            e.g. `temp: 281` → 28.1°C, `bar: 10247` → 1024.7 hPa, `uvi: 70` → UV 7.0
          properties:
            epoch:
              type: string
            temp:
              type: string
            hum:
              type: string
            dew:
              type: string
            chill:
              type: string
            heat:
              type: string
            bar:
              type: string
            wdir:
              type: string
            wspd:
              type: string
            wspdavg:
              type: string
            wspdhi:
              type: string
            rainrate:
              type: string
            rain:
              type: string
            solarrad:
              type: string
            uvi:
              type: string
            tempin:
              type: string
              description: Indoor temperature (°C, scaled ×10) — if sensor present
            humin:
              type: string
              description: Indoor humidity (%, scaled ×10) — if sensor present
    PageDevicesResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/PageDevice'

    ForecastResponse:
      type: object
      properties:
        info:
          type: object
          properties:
            source:
              type: string
              example: WMO
            web:
              type: string
              example: https://worldweather.wmo.int
            days:
              type: integer
              example: 6
        location:
          type: object
          properties:
            name:
              type: string
              description: Nearest city name
              example: Ingelmunster
        forecast:
          type: object
          description: Keyed by date string (YYYY-MM-DD)
          additionalProperties:
            type: object
            properties:
              weather:
                type: object
                properties:
                  code:
                    type: integer
                    description: WMO weather interpretation code
              temperature:
                type: object
                properties:
                  max:
                    type: integer
                    nullable: true
                  min:
                    type: integer
                    nullable: true

    MapDevicesResponse:
      type: object
      description: |
        Stations as compact arrays. Also contains `owner` and `favorites` arrays (empty unless logged in).
      properties:
        devices:
          type: array
          description: |
            Each entry is an array:
            `[id, city, lat, lon, status, 0, temp×10, hum, bar×10, wspd×10, wdir, rainrate×10, rain×10, solarrad×10, uvi×10]`

            - `status`: 1=online, 2=recently online, 3=offline
            - Divide index 6 and above by 10 to get real units
          items:
            type: array
            example: ["RWACTX", "Wilsele-Herent", 50.904295, 4.69565, 2, 0, 277, 54, 10270, 19, 336, 0, 0, 8050, 47]
        owner:
          type: array
          description: Owner's own stations (empty if not logged in)
          items:
            type: array
        favorites:
          type: array
          description: Favourite stations (empty if not logged in)
          items:
            type: array
