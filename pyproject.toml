[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weathercloud"
dynamic = ["version"]
description = "Cloudflare Forge schema-first typed Python SDK for Weathercloud"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mauro Druwel" }]
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]
keywords = ["weathercloud", "weather", "api", "sdk", "home-assistant", "cloudflare-forge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "responses>=0.24",
]
dev = [
    "weathercloud[test]",
    "ruff>=0.6",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/MauroDruwel/Weathercloud"
Documentation = "https://weathercloud-api.maurodruwel.be"
"Bug Tracker" = "https://github.com/MauroDruwel/Weathercloud/issues"
"Source Code" = "https://github.com/MauroDruwel/Weathercloud"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weathercloud = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "weathercloud.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
    "scripts",
    "src/weathercloud/core",
    "src/weathercloud/types",
    "src/weathercloud/auth",
    "src/weathercloud/device_history",
    "src/weathercloud/device_live",
    "src/weathercloud/forecast",
    "src/weathercloud/map_",
    "src/weathercloud/metar",
    "src/weathercloud/stations",
    "src/weathercloud/tests",
    "src/weathercloud/_default_clients.py",
    "src/weathercloud/environment.py",
    "src/weathercloud/client.py",
    "src/weathercloud/__init__.py",
    "src/weathercloud/version.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B010"]

[tool.mypy]
python_version = "3.10"
packages = ["weathercloud"]
warn_unused_ignores = false
ignore_missing_imports = true
